<style>

            color: #e5e2e1;

            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;

            z-index: 9999;
            opacity: 0.05;

        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);

            transition: all 0.2s ease;
        }

        }
        .calendar-day.selected {
            background-color: #ffffff;
            color: #000000;
        }
        .calendar-day.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .time-slot {
            transition: all 0.2s ease;
        }
        .time-slot:hover {
            background-color: #3a3939;
            cursor: pointer;

        .time-slot.selected {
            background-color: #ffffff;
            color: #000000;

<body class="bg-background dark font-body-md text-on-surface antialiased overflow-x-hidden selection:bg-primary selection:text-on-primary">
<div class="noise-overlay"></div>



<main class="pb-24 pt-12 md:pt-32 px-grid-margin max-w-5xl mx-auto min-h-screen">
    
    <!-- Header Agendamento -->
    <div class="flex flex-col items-center text-center mb-16 gap-6 relative z-10">
        <img alt="Logo Máquina Voadora" class="h-40 md:h-56 w-auto mb-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEIgzcOewCm-n2Ht1WoS7vqV6qMKf_yQvkSmSZbdCafqwBi_HNYDjLDBv8ZjM4QNVJuv2OPyyJSLI4VhZ7oYWbi7lEsJQjWIO5glIncyIbmziFTWoENzJceG1A-ZVzq1FbucQ0gP36rUwpoGySCIYz-rNUYTMoediRcQzfju_PXdwHtHaM5I8xHp_P9pulmJ5ACusOCQy18gvuQUHRGE9yU-FzhK533OSAfSldTauSd6CYe-X84-T1ilJO9yk_yFGr">
        <h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg text-primary uppercase leading-tight">
            Agendamento<br>de Ensaios
        </h1>
        <p class="text-body-lg text-on-surface-variant max-w-2xl">
            Selecione uma data e horário abaixo para pré-agendar o ensaio da sua banda no Máquina Voadora Estúdio.
        </p>
    </div>

    <!-- Interface Principal -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
        
        <!-- Passo 1: Calendario -->
        <div class="bg-surface-container border border-outline-variant/30 p-6 shadow-xl relative">
            <div class="absolute -top-3 -left-3 bg-primary text-black font-label-mono px-3 py-1 text-sm font-bold uppercase">Passo 1</div>
            
            <div class="flex justify-between items-center mb-6 mt-4">
                <button id="prevMonth" class="p-2 hover:bg-surface-variant rounded-full transition-colors"><span class="material-symbols-outlined">chevron_left</span></button>
                <h3 id="monthDisplay" class="text-xl font-headline-md uppercase tracking-wider text-primary">Agosto 2026</h3>
                <button id="nextMonth" class="p-2 hover:bg-surface-variant rounded-full transition-colors"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>

            <div class="grid grid-cols-7 gap-2 mb-2 text-center text-label-mono text-on-surface-variant uppercase">
                <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
            </div>
            
            <div id="calendarGrid" class="grid grid-cols-7 gap-2 text-center">
                <!-- Gerado por JS -->
            </div>
        </div>

        <!-- Passo 2 e 3: Horarios e Formulario -->
        <div class="flex flex-col gap-8">
            
            <!-- Horarios -->
            <div id="timeSelectionArea" class="bg-surface-container border border-outline-variant/30 p-6 shadow-xl relative opacity-50 pointer-events-none transition-opacity">
                <div class="absolute -top-3 -left-3 bg-primary text-black font-label-mono px-3 py-1 text-sm font-bold uppercase">Passo 2</div>
                
                <h3 class="text-lg font-headline-md uppercase text-primary mb-4 mt-2">Horários Disponíveis</h3>
                <p id="selectedDateDisplay" class="text-sm text-on-surface-variant mb-4">Selecione uma data primeiro.</p>
                
                <div id="timeGrid" class="grid grid-cols-3 gap-3">
                    <!-- Gerado por JS -->
                </div>
            </div>

            <!-- Formulario -->
            <div id="formArea" class="bg-surface-container border border-outline-variant/30 p-6 shadow-xl relative opacity-50 pointer-events-none transition-opacity">
                <div class="absolute -top-3 -left-3 bg-primary text-black font-label-mono px-3 py-1 text-sm font-bold uppercase">Passo 3</div>
                
                <h3 class="text-lg font-headline-md uppercase text-primary mb-4 mt-2">Dados da Banda</h3>
                
                <form id="bookingForm" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-label-mono uppercase text-on-surface-variant mb-2">Nome da Banda</label>
                        <input type="text" id="bandName" required class="w-full bg-background border border-outline-variant/50 p-3 text-primary focus:border-primary focus:outline-none transition-colors" placeholder="Ex: Os Suricatos">
                    </div>
                    <div>
                        <label class="block text-label-mono uppercase text-on-surface-variant mb-2">Telefone (WhatsApp)</label>
                        <input type="tel" id="bandPhone" required class="w-full bg-background border border-outline-variant/50 p-3 text-primary focus:border-primary focus:outline-none transition-colors" placeholder="(34) 99999-9999">
                    </div>
                    
                    <button type="submit" class="w-full bg-[#25D366] text-black font-bold py-4 mt-4 uppercase tracking-wider hover:bg-[#1ebd5a] transition-colors flex items-center justify-center gap-2">
                        Solicitar via WhatsApp
                        <span class="material-symbols-outlined text-sm">send</span>
                    </button>
                </form>
            </div>
            
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="full-width border-t border-outline-variant/20 flex flex-col items-center bg-surface-container-lowest dark:bg-surface-container-lowest">
    <div class="max-w-7xl mx-auto w-full flex items-center justify-center gap-12 pt-12 pb-12">
        <img alt="Logo Máquina Voadora" class="h-32 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEIgzcOewCm-n2Ht1WoS7vqV6qMKf_yQvkSmSZbdCafqwBi_HNYDjLDBv8ZjM4QNVJuv2OPyyJSLI4VhZ7oYWbi7lEsJQjWIO5glIncyIbmziFTWoENzJceG1A-ZVzq1FbucQ0gP36rUwpoGySCIYz-rNUYTMoediRcQzfju_PXdwHtHaM5I8xHp_P9pulmJ5ACusOCQy18gvuQUHRGE9yU-FzhK533OSAfSldTauSd6CYe-X84-T1ilJO9yk_yFGr">
    </div>
</footer>

<script>
    // Configurações e Estado
    const now = new Date();
    let currentMonth = now.getMonth();
    let currentYear = now.getFullYear();
    
    let selectedDate = null; // Instância Date
    let selectedTimes = []; // Array de Strings

    const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

    // Elementos DOM
    const monthDisplay = document.getElementById('monthDisplay');
    const calendarGrid = document.getElementById('calendarGrid');
    const timeSelectionArea = document.getElementById('timeSelectionArea');
    const timeGrid = document.getElementById('timeGrid');
    const selectedDateDisplay = document.getElementById('selectedDateDisplay');
    const formArea = document.getElementById('formArea');
    const bookingForm = document.getElementById('bookingForm');

    // Inicialização
    function initCalendar() {
        document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
        document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
        bookingForm.addEventListener('submit', handleFormSubmit);
        
        renderCalendar();
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        } else if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderCalendar();
    }

    function renderCalendar() {
        calendarGrid.innerHTML = '';
        monthDisplay.textContent = `${monthNames[currentMonth]} ${currentYear}`;
        
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        
        const today = new Date();
        today.setHours(0,0,0,0);

        // Espaços vazios iniciais
        for (let i = 0; i < firstDay; i++) {
            const emptyDiv = document.createElement('div');
            calendarGrid.appendChild(emptyDiv);
        }

        // Dias do mês
        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(currentYear, currentMonth, day);
            const dayDiv = document.createElement('div');
            
            dayDiv.textContent = day;
            dayDiv.className = 'calendar-day border border-outline-variant/30 py-3 text-lg font-bold';
            
            // Passado = desabilitado
            if (dateObj < today) {
                dayDiv.classList.add('disabled');
            } else {
                dayDiv.addEventListener('click', () => selectDate(dateObj, dayDiv));
            }

            // Selecionado anteriormente?
            if (selectedDate && 
                selectedDate.getDate() === day && 
                selectedDate.getMonth() === currentMonth && 
                selectedDate.getFullYear() === currentYear) {
                dayDiv.classList.add('selected');
            }

            calendarGrid.appendChild(dayDiv);
        }
    }

    function selectDate(dateObj, element) {
        // Atualiza UI Calendario
        document.querySelectorAll('.calendar-day.selected').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        
        selectedDate = dateObj;
        selectedTimes = []; // Reseta horarios
        
        // Atualiza Passo 2
        timeSelectionArea.classList.remove('opacity-50', 'pointer-events-none');
        formArea.classList.add('opacity-50', 'pointer-events-none'); // Esconde form ate escolher hora
        
        const dayOfWeek = dateObj.getDay();
        let isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        
        selectedDateDisplay.textContent = `${dateObj.getDate()} de ${monthNames[dateObj.getMonth()]} de ${dateObj.getFullYear()}`;
        
        generateTimeSlots(isWeekend);
    }

    function generateTimeSlots(isWeekend) {
        timeGrid.innerHTML = '';
        let startHour = isWeekend ? 14 : 18;
        let endHour = isWeekend ? 20 : 23;
        
        for (let h = startHour; h <= endHour; h++) {
            const timeStr = `${h.toString().padStart(2, '0')}:00`;
            const slot = document.createElement('div');
            
            slot.textContent = timeStr;
            slot.className = 'time-slot border border-outline-variant/30 py-3 text-center font-label-mono text-sm uppercase tracking-widest';
            
            slot.addEventListener('click', () => selectTime(timeStr, slot));
            timeGrid.appendChild(slot);
        }
    }

    function selectTime(timeStr, element) {
        if (selectedTimes.includes(timeStr)) {
            selectedTimes = selectedTimes.filter(t => t !== timeStr);
            element.classList.remove('selected');
        } else {
            selectedTimes.push(timeStr);
            element.classList.add('selected');
        }
        
        // Libera Passo 3 se tiver pelo menos 1 horario
        if (selectedTimes.length > 0) {
            formArea.classList.remove('opacity-50', 'pointer-events-none');
        } else {
            formArea.classList.add('opacity-50', 'pointer-events-none');
        }
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        
        if (!selectedDate || selectedTimes.length === 0) return;

        const band = document.getElementById('bandName').value.trim();
        const phone = document.getElementById('bandPhone').value.trim();
        const dateStr = `${selectedDate.getDate().toString().padStart(2,'0')}/${(selectedDate.getMonth()+1).toString().padStart(2,'0')}/${selectedDate.getFullYear()}`;
        
        selectedTimes.sort();
        const timesStr = selectedTimes.join(', ');
        
        const message = `Olá Máquina Voadora! Gostaria de agendar um ensaio para a banda *${band}* no dia *${dateStr}* nos horários: *${timesStr}*. Meu contato é ${phone}. Podem confirmar a disponibilidade?`;
        
        const encodedMessage = encodeURIComponent(message);
        const whatsappNumber = "5534992839811";
        const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
        
        window.open(whatsappUrl, '_blank');
    }

    // Run
    initCalendar();

</script>
